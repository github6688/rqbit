name: Build Universal Windows rqbit.exe (32 & 64-bit)

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-universal-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 32-bit target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc

      - name: npm install (librqbit/webui)
        working-directory: crates/librqbit/webui
        run: npm install

      - name: Build Universal rqbit.exe
        run: cargo build --profile release-github --target i686-pc-windows-msvc -p rqbit

      - name: Upload Universal rqbit.exe
        uses: actions/upload-artifact@v4
        with:
          name: rqbit-win-universal
          path: target/i686-pc-windows-msvc/release-github/rqbit.exe
